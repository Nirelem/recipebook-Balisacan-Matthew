{% extends 'base.html' %}

{% load static %}

{% block title %} Recipe List {% endblock %}

{% block content %}
		<ul style="list-style-type: none">
			{% for recipe in recipes %}
            <li><a href="{% url 'ledger:recipe_detail' recipe.id %}">{{ recipe.name }}</a></li>
			{% empty %}
				<li>No recipes available.</li>
			{% endfor %}
		</ul>
{% endblock %}
